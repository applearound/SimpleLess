[package]
name = "simpleless"
version = "0.3.0"
description = "A speech-first voice input tool"
authors = ["Yezhou_LP"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "simpleless_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
cpal = "0.15"
enigo = "0.2"
arboard = "3"
keyring = { version = "3", features = ["windows-native", "apple-native"] }
uuid = { version = "1", features = ["v4"] }
sherpa-onnx = "1.13.8"
sha2 = "0.10"

# 测试专用：log 门面 + env_logger 实现，日志级别由 RUST_LOG 环境变量控制
[dev-dependencies]
log = "0.4"
env_logger = "0.11"

# macOS：把字幕窗口转为 NSPanel 才能悬浮在全屏应用所在空间
[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = "2.1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
